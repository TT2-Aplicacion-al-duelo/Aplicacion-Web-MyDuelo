<div class="container-fluid py-4">
  <div class="card">
    <div class="card-body">
      <button class="btn btn-sm btn-outline-secondary mb-3" [routerLink]="['/foros', idForo]">
        <i class="bi bi-arrow-left"></i> Volver al Foro
      </button>

      <h3>Solicitudes de Unión Pendientes</h3>

      <div *ngIf="cargando" class="text-center py-5">
        <div class="spinner-border" role="status"></div>
      </div>

      <div *ngIf="!cargando && solicitudes.length === 0" class="alert alert-info">
        No hay solicitudes pendientes
      </div>

      <div class="list-group">
        <div *ngFor="let solicitud of solicitudes" class="list-group-item">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <h6 class="mb-1">
                {{solicitud.usuario.nombre}} {{solicitud.usuario.apellido}}
                <span class="badge bg-secondary ms-2">{{solicitud.tipo_usuario}}</span>
              </h6>
              <p *ngIf="solicitud.mensaje" class="mb-2 text-muted">
                <i class="bi bi-chat-quote"></i> "{{solicitud.mensaje}}"
              </p>
              <small class="text-muted">
                Solicitud enviada: {{solicitud.fecha_solicitud | date:'dd/MM/yyyy HH:mm'}}
              </small>
            </div>
            <div class="btn-group">
              <button 
                class="btn btn-success btn-sm" 
                (click)="aprobar(solicitud)">
                <i class="bi bi-check-circle"></i> Aprobar
              </button>
              <button 
                class="btn btn-danger btn-sm" 
                (click)="rechazar(solicitud)">
                <i class="bi bi-x-circle"></i> Rechazar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container py-4">
  <h2 class="mb-4"><i class="bi bi-envelope"></i> Mis Invitaciones</h2>

  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border"></div>
  </div>

  <div *ngIf="!cargando" class="list-group">
    <div *ngFor="let inv of invitaciones" class="list-group-item">
      <div class="d-flex justify-content-between align-items-start">
        <div class="flex-grow-1">
          <h6>{{inv.foro.titulo}}</h6>
          <p class="mb-1">
            <strong>{{inv.invitador.nombre}} {{inv.invitador.apellidoPaterno}}</strong>
            te invitó a ser <span class="badge bg-warning text-dark">Moderador</span>
          </p>
          <p class="text-muted small mb-1" *ngIf="inv.mensaje">{{inv.mensaje}}</p>
          <small class="text-muted">
            {{inv.fecha_invitacion | date:'dd/MM/yyyy HH:mm'}}
          </small>
        </div>
        <div>
          <span class="badge" [ngClass]="getBadgeEstado(inv.estado)">
            {{inv.estado}}
          </span>
        </div>
      </div>
      
      <div *ngIf="inv.estado==='pendiente'" class="mt-3">
        <button class="btn btn-success btn-sm me-2" (click)="responder(inv, true)">
          <i class="bi bi-check"></i> Aceptar
        </button>
        <button class="btn btn-danger btn-sm" (click)="responder(inv, false)">
          <i class="bi bi-x"></i> Rechazar
        </button>
      </div>
    </div>

    <div *ngIf="invitaciones.length===0" class="alert alert-info">
      No tienes invitaciones
    </div>
  </div>
</div>

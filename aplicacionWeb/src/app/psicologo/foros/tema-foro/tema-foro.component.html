<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card mb-3">
        <div class="card-body">
          <button class="btn btn-sm btn-outline-secondary mb-2" 
                  [routerLink]="['/foros', idForo]">
            <i class="bi bi-arrow-left"></i> Volver al foro
          </button>
          <h4>Conversación</h4>
        </div>
      </div>

      <div class="card">
        <div class="card-body" #messagesContainer 
             style="height: 500px; overflow-y: auto; background: #f8f9fa;">
          
          <div *ngIf="cargando" class="text-center py-5">
            <div class="spinner-border"></div>
          </div>

          <div *ngFor="let mensaje of mensajes" class="mb-3">
            <div class="mensaje" [ngClass]="{'mensaje-propio': esMiMensaje(mensaje)}">
              <div class="mensaje-autor">
                <strong>{{mensaje.autor.nombre}} {{mensaje.autor.apellido}}</strong>
                <span class="badge bg-secondary ms-2">{{mensaje.autor.tipo}}</span>
              </div>
              <div class="mensaje-contenido">{{mensaje.contenido}}</div>
              <small class="text-muted">
                {{mensaje.fecha_envio | date:'dd/MM/yyyy HH:mm'}}
              </small>
            </div>
          </div>

          <div *ngIf="mensajes.length===0 && !cargando" class="text-center text-muted py-5">
            No hay mensajes aún. ¡Sé el primero en escribir!
          </div>
          <!-- ✅ FASE 3: Botones de moderación de mensajes -->
          <div *ngIf="puedeModerar() && !mensaje.eliminado" class="mt-2">
            <button 
              *ngIf="mensajeEditando !== mensaje.id_mensaje_foro"
              class="btn btn-sm btn-outline-warning me-2" 
              (click)="iniciarEdicion(mensaje)">
              <i class="bi bi-pencil"></i> Editar
            </button>
            <button 
              class="btn btn-sm btn-outline-danger" 
              (click)="eliminarMensaje(mensaje)">
              <i class="bi bi-trash"></i> Eliminar
            </button>
          </div>

          <!-- Editor de mensaje -->
          <div *ngIf="mensajeEditando === mensaje.id_mensaje_foro" class="mt-2">
            <textarea 
              class="form-control mb-2" 
              [(ngModel)]="contenidoEditado" 
              rows="3">
            </textarea>
            <button class="btn btn-sm btn-success me-2" (click)="guardarEdicion(mensaje.id_mensaje_foro)">
              <i class="bi bi-check"></i> Guardar
            </button>
            <button class="btn btn-sm btn-secondary" (click)="cancelarEdicion()">
              <i class="bi bi-x"></i> Cancelar
            </button>
          </div>

          <!-- Indicador de mensaje editado -->
          <small *ngIf="mensaje.editado" class="text-muted d-block mt-1">
            <i class="bi bi-pencil-fill"></i> Editado
            <span *ngIf="mensaje.fecha_edicion">el {{ mensaje.fecha_edicion | date:'dd/MM/yyyy HH:mm' }}</span>
          </small>
        </div>
        
        <div class="card-footer bg-white">
          <form (submit)="enviarMensaje(); $event.preventDefault()">
            <div class="input-group">
              <textarea class="form-control" rows="2" 
                        [(ngModel)]="nuevoMensaje" name="mensaje"
                        placeholder="Escribe tu mensaje..."
                        [disabled]="enviando"></textarea>
              <button class="btn btn-primary" type="submit"
                      [disabled]="enviando || !nuevoMensaje.trim()">
                <i class="bi bi-send"></i> Enviar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card mb-3">
        <div class="card-body">
          <button class="btn btn-sm btn-outline-secondary mb-2" 
                  [routerLink]="['/foros', idForo]">
            <i class="bi bi-arrow-left"></i> Volver al foro
          </button>
          <h4>Conversación</h4>
        </div>
      </div>

      <div class="card">
        <div class="card-body" #messagesContainer 
             style="height: 500px; overflow-y: auto; background: #f8f9fa;">
          
          <div *ngIf="cargando" class="text-center py-5">
            <div class="spinner-border"></div>
          </div>

          <div *ngFor="let mensaje of mensajes" class="mb-3">
            <div class="mensaje" [ngClass]="{'mensaje-propio': esMiMensaje(mensaje)}">
              <div class="mensaje-autor">
                <strong>{{mensaje.autor.nombre}} {{mensaje.autor.apellido}}</strong>
                <span class="badge bg-secondary ms-2">{{mensaje.autor.tipo}}</span>
              </div>
              <div class="mensaje-contenido">{{mensaje.contenido}}</div>
              <small class="text-muted">
                {{mensaje.fecha_envio | date:'dd/MM/yyyy HH:mm'}}
              </small>
            </div>
          </div>

          <div *ngIf="mensajes.length===0 && !cargando" class="text-center text-muted py-5">
            No hay mensajes aún. ¡Sé el primero en escribir!
          </div>
        </div>

        <div class="card-footer bg-white">
          <form (submit)="enviarMensaje(); $event.preventDefault()">
            <div class="input-group">
              <textarea class="form-control" rows="2" 
                        [(ngModel)]="nuevoMensaje" name="mensaje"
                        placeholder="Escribe tu mensaje..."
                        [disabled]="enviando"></textarea>
              <button class="btn btn-primary" type="submit"
                      [disabled]="enviando || !nuevoMensaje.trim()">
                <i class="bi bi-send"></i> Enviar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- aplicacionWeb/src/app/psicologo/paciente-detalle/componentes/graficas-notas/graficas-notas.component.html -->

<div class="graficas-notas-container">
  <!-- Header con navegación de secciones -->
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="mb-0">
          <i class="bi bi-graph-up me-2"></i>
          Evaluaciones y Notas del Paciente
        </h5>
      </div>
    </div>
    
    <div class="card-body p-0">
      <!-- Navegación por tabs -->
      <ul class="nav nav-tabs nav-fill" role="tablist">
        <li class="nav-item" role="presentation">
          <button 
            class="nav-link"
            [class.active]="seccionActiva === 'historial'"
            (click)="cambiarSeccion('historial')"
            type="button">
            <i class="bi bi-clock-history me-2"></i>
            Historial de Tests
          </button>
        </li>
        
        <li class="nav-item" role="presentation">
          <button 
            class="nav-link"
            [class.active]="seccionActiva === 'disponibles'"
            (click)="cambiarSeccion('disponibles')"
            type="button">
            <i class="bi bi-clipboard-check me-2"></i>
            Tests Disponibles
          </button>
        </li>
        
        <li class="nav-item" role="presentation">
          <button 
            class="nav-link"
            [class.active]="seccionActiva === 'notas'"
            (click)="cambiarSeccion('notas')"
            type="button">
            <i class="bi bi-journal-text me-2"></i>
            Notas del Psicólogo
          </button>
        </li>
      </ul>
    </div>
  </div>

  <!-- Contenido de las secciones -->
  <div class="tab-content">
    <!-- Historial de Tests -->
    <div *ngIf="seccionActiva === 'historial'" class="tab-pane fade show active">
      <app-historial-tests [idPaciente]="idPaciente"></app-historial-tests>
    </div>

    <!-- Tests Disponibles -->
    <div *ngIf="seccionActiva === 'disponibles'" class="tab-pane fade show active">
      <app-tests-disponibles 
        [idPaciente]="idPaciente"
        (testAplicado)="onTestAplicado()">
      </app-tests-disponibles>
    </div>

    <!-- Notas del Psicólogo -->
    <div *ngIf="seccionActiva === 'notas'" class="tab-pane fade show active">
      <app-notas-psicologo [idPaciente]="idPaciente"></app-notas-psicologo>
    </div>
  </div>
</div>
